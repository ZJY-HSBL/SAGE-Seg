[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-seg"
version = "0.1.0"
description = "Semantic-aware gated enhancement for semi-supervised segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "tqdm>=4.66",
  "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["sage_seg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
